function is_self_dn42_net() {
    return net ~ DN42_OWNNETSET;
}

function is_self_dn42_net_v6() {
    return net ~ DN42_OWNNETSETv6;
}

function is_valid_dn42_network() {
    return net ~ [
        172.20.0.0/14{21,29}, # dn42
        172.20.0.0/24{28,32}, # dn42 Anycast
        172.21.0.0/24{28,32}, # dn42 Anycast
        172.22.0.0/24{28,32}, # dn42 Anycast
        172.23.0.0/24{28,32}, # dn42 Anycast
        172.31.0.0/16+,       # ChaosVPN
        10.100.0.0/14+,       # ChaosVPN
        10.127.0.0/16{16,32}, # neonetwork
        10.0.0.0/8{15,24}     # Freifunk.net
    ];
}

function is_valid_dn42_network_v6() {
  return net ~ [
    fd00::/8{44,64} # ULA address space as per RFC 4193
  ];
}

function is_valid_backbone_network(){
  return net ~ [
    100.64.0.0/24,  # Domestic
    100.64.1.0/24,  # Global
    100.64.248.0/30 # Backbone
  ];
}

function is_valid_backbone_network_v6(){
  return net ~ [
    fd18:3e15:61d0:1000::/64, # Domestic
    fd18:3e15:61d0:1001::/64, # Global
    fd18:3e15:61d0:ffff::/64  # Backbone
  ];
}
