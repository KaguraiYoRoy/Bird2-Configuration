function iana_upstream_add_community(){
    bgp_large_community.add((205369,1,1)); # control: allow route to be advertised on IANA infrastructures
    bgp_large_community.add((205369,2,102)); # origin identify: from upstream
}

function iana_upstream_check_community(){
    if !(bgp_large_community ~ [(205369,1,1)]) then return false; # control: allow to be advertised on IANA infrastructures
    if bgp_large_community ~ [(205369,65535,65282)] then return false; # control: no-advertise
    if bgp_large_community ~ [(205369,65535,65281)] then return false; # control: no-export

    if bgp_large_community ~ [(205369,2,0)] then return false; # origin identify: private network
    if bgp_large_community ~ [(205369,2,101)] then return false; # origin identify: from peer
    if bgp_large_community ~ [(205369,2,102)] then return false; # origin identify: from upstream

    return true;
}

template bgp iana_upstream {
    local as IANA_OWNAS;
    path metric 1;
    router id IANA_ROUTER_ID;

    ipv6 {
        import filter {
            if !iana_filter_default_check() then reject;
            remove_confederation_as(); # anti injection
            remove_private_community(); # anti injection
            iana_upstream_add_community();
            accept;
        };
        export filter {
            if !iana_filter_default_check() then reject;
            if !iana_upstream_check_community() then reject;
            remove_confederation_as();
            remove_private_community();
            accept;
        };
        export limit 10;
    };

    graceful restart; 
}

protocol bgp 'iana_upstream_44324' from iana_upstream{
    description "MoeDove";
    neighbor fc00:230::1 as 44324;
}

