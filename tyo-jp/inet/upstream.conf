template bgp inet_upstream {
    local as INET_OWNAS;
    path metric 1;
    router id INET_ROUTER_ID;

    ipv6 {
        import filter {
            if net ~ [::/0] then reject;
            krt_prefsrc = INET_OWNIPv6;
            bgp_large_community.add((205369,1000,1));
            accept;
        };
        export filter {
            if is_self_iana_v6() then{
                if !iana_should_export() then reject;
                remove_confederation_as();
                remove_private_community();
                accept;
            }
            reject;
        };
        export limit 10;
    };

    graceful restart; 
}

protocol bgp 'inet_upstream_44324' from inet_upstream{
    description "MoeDove";
    neighbor fc00:230::1 as 44324;
}

