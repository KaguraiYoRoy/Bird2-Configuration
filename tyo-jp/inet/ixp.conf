template bgp inet_ix{
    router id INET_ROUTER_ID;
    local as INET_OWNAS;
    ipv6 {
        import filter {
            if net ~ [::/0] then reject;
            bgp_large_community.add((205369,1000,1));
            accept;
        };
        export filter {
            if is_self_iana_v6() then {
                if !iana_should_export() then reject;
                remove_confederation_as();
                remove_private_community();
                accept;
            }
            reject;
        };
    };
    graceful restart;
}

protocol bgp 'inet_ix_203168' from inet_ix{
    description "Protocol 7 IX";
    local 2602:f92a:1315::1d;
    neighbor 2602:f92a:1315::1 as 203168;
}
