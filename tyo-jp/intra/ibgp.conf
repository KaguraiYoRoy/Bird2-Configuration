template bgp intra_ibgpeers {
    router   id DN42_OWNIP;
    local    as INTRA_OWNAS;
    neighbor external;

    ipv4 {
        table master4;
        import filter{
            if source = RTS_BGP then{
                accept;
            } 
            reject;
        };
        export filter {
            if !intra_should_export() then reject;
            accept;
        };
        extended next hop;
    };
    ipv6 {
        table master6;
        import filter{
            if source = RTS_BGP then{
                accept;
            } 
            reject;
        };
        export filter {
            if !intra_should_export() then reject;
            accept;
        };
    };
};

include "ibgp/*";
