bird:
  log_syslog_all: true
  device_scan_time: 10
  device_semicolon: true
modules:
  iana:
    enabled: true
    includes:
    - rpki.conf
    - filter.conf
    - static.conf
    - upstream.conf
    - peer.conf
    - downstream.conf
  dn42:
    enabled: true
    includes:
    - rpki.conf
    - flapalerted.conf
    - filter.conf
    - static.conf
    - ebgp.conf
  intra:
    enabled: true
    includes:
    - filter.conf
    - ibgp.conf
    - static.conf
intra:
  static:
    v4_routes:
    - prefix: 172.20.234.227/32
      communities:
      - [4242422024, 1, 1]
      - [4242422024, 2, 0]
      - [4242422024, 2, 100]
      - [4242422024, 65535, 65281]
      - [65535, 65281]
    v6_routes:
    - prefix: fd18:3e15:61d0::3/128
      communities:
      - [4242422024, 1, 1]
      - [4242422024, 2, 0]
      - [4242422024, 2, 100]
      - [4242422024, 65535, 65281]
      - [65535, 65281]
    - prefix: 2a14:7583:f228::63f4/128
      communities:
      - [205369, 1, 1]
      - [205369, 2, 0]
      - [205369, 2, 100]
      - [205369, 65535, 65281]
      - [65535, 65281]
  ibgp_sessions:
  - file: fra01.conf
    protocol: intra_ibgp_fra01
    neighbor:
      node: fra01-de
      interface: intra_fra01
  - file: hkg02.conf
    protocol: intra_ibgp_hkg02
    neighbor:
      node: hkg02-hk
      interface: intra_hkg02
    ipv4:
      import_policy: full
      export_policy: full
    ipv6:
      import_policy: full
      export_policy: full
  - file: lax.conf
    protocol: intra_ibgp_lax
    neighbor:
      node: lax01-us
      interface: intra_lax
  - file: tyo02.conf
    protocol: intra_ibgp_tyo02
    neighbor:
      node: tyo02-jp
      interface: intra_tyo02
    ipv4:
      import_policy: full
      export_policy: full
    ipv6:
      import_policy: full
      export_policy: full
  - file: tyo03.conf
    protocol: intra_ibgp_tyo03
    neighbor:
      node: tyo03-jp
      interface: intra_tyo03
    ipv4:
      import_policy: full
      export_policy: full
    ipv6:
      import_policy: full
      export_policy: full
