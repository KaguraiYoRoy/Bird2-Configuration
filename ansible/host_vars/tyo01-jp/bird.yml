bird:
  log_syslog_all: true
  device_scan_time: 10
  device_semicolon: true
modules:
  iana:
    enabled: true
    includes:
    - rpki.conf
    - filter.conf
    - static.conf
    - upstream.conf
    - peer.conf
    - downstream.conf
  dn42:
    enabled: true
    includes:
    - rpki.conf
    - flapalerted.conf
    - filter.conf
    - static.conf
    - ebgp.conf
  intra:
    enabled: true
    includes:
    - filter.conf
    - ibgp.conf
    - static.conf
intra:
  static:
    v4_routes:
    - prefix: 172.20.234.227/32
    v6_routes:
    - prefix: fd18:3e15:61d0::3/128
    - prefix: 2a14:7583:f228::63f4/128
