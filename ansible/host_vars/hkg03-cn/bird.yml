bird:
  log_syslog_all: true
  device_scan_time: 10
  device_semicolon: true
  include_sections:
  - - path: filter.conf
  - - path: iana/rpki.conf
    - path: iana/filter.conf
    - path: iana/static.conf
    - path: iana/upstream.conf
    - path: iana/peer.conf
    - path: iana/downstream.conf
    - path: iana/ibgp.conf
  - - path: intra/filter.conf
    - path: intra/ibgp.conf
    - path: intra/static.conf
  - - path: kernel.conf
modules:
  iana:
    enabled: true
    includes:
    - rpki.conf
    - filter.conf
    - static.conf
    - upstream.conf
    - peer.conf
    - downstream.conf
    - ibgp.conf
  dn42:
    enabled: false
    includes: []
  intra:
    enabled: true
    includes:
    - filter.conf
    - ibgp.conf
    - static.conf
intra:
  own_as: 4220240102
  router_id: DN42_OWNIP
  static:
    v4_routes:
    - prefix: 100.64.0.2/32
      communities:
      - [4242422024, 1, 1]
      - [4242422024, 2, 0]
      - [4242422024, 2, 100]
      - [4242422024, 65535, 65281]
    v6_routes:
    - prefix: fd18:3e15:61d0:cafe::2/128
      communities:
      - [4242422024, 1, 1]
      - [4242422024, 2, 0]
      - [4242422024, 2, 100]
      - [4242422024, 65535, 65281]
    - prefix: 2a14:7583:f224::872c/128
      communities:
      - [205369, 1, 1]
      - [205369, 2, 0]
      - [205369, 2, 100]
      - [205369, 65535, 65281]
      - 
  ibgp_sessions: 
  - file: hkg02.conf
    protocol: intra_ibgp_hkg02
    neighbor:
      address: fe80::2024:225
      interface: intra_hkg02
    ipv4:
      import_policy: full
      export_policy: full
    ipv6:
      import_policy: full
      export_policy: full