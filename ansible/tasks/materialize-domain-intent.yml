---
# Materialize effective variables from domain intent and legacy overrides.
#
# This file:
#   1. generates interface/session data from domain-level peer declarations
#      (intra.auto_confed_peers, future dn42_peers / iana_peers)
#   2. merges generated data with explicit intra / legacy wireguard overrides
#
# Downstream playbooks (render-wireguard.yml, render.yml, validate-*) should
# consume only the effective_* variables.

# ── Normalize intra peer intent ───────────────────────────────────────────

- name: Build effective intra peer intent lists
  ansible.builtin.set_fact:
    effective_intra_auto_confed_peers: "{{ intra.auto_confed_peers | default([]) if intra is defined else [] }}"
    effective_intra_explicit_confed_peers: "{{ intra.explicit_confed_peers | default([]) if intra is defined else [] }}"

# ── Intra peer intent → WireGuard interfaces ───────────────────────────

- name: Initialize generated WireGuard interfaces
  ansible.builtin.set_fact:
    generated_wireguard_intra: []

- name: Build generated WireGuard interfaces from intra peers
  ansible.builtin.set_fact:
    generated_wireguard_intra: "{{ generated_wireguard_intra + [wg_iface] }}"
  loop: "{{ effective_intra_auto_confed_peers }}"
  loop_control:
    loop_var: peer
  vars:
    _wg: "{{ peer.wireguard | default({}) }}"
    _d: "{{ intra_wireguard_defaults | default({}) }}"
    _peer_vars: "{{ hostvars[peer.node] | default({}) }}"
    _peer_intra: "{{ (_peer_vars.intra.auto_confed_peers | default([])) if _peer_vars.intra is defined else [] }}"
    _return_entry: "{{ _peer_intra | selectattr('node', 'equalto', inventory_hostname) | list }}"
    _derived_endpoint_host: "{{ _peer_vars.ansible_host | default('') }}"
    _derived_endpoint_port: "{{ (_return_entry[0].wireguard.listen_port) if _return_entry | length > 0 else '' }}"
    _derived_endpoint: "{{ _derived_endpoint_host + ':' + (_derived_endpoint_port | string) if _derived_endpoint_host and _derived_endpoint_port != '' else '' }}"
    _endpoint: "{{ _wg.endpoint if _wg.endpoint is defined else _derived_endpoint }}"
    _peer: "{{
      {'public_key': _wg.public_key,
       'allowed_ips': _wg.allowed_ips | default(_d.allowed_ips)}
      | combine({'endpoint': _endpoint}              if not (_wg.passive | default(false)) and _endpoint | default('', true) | length > 0 else {})
      | combine({'endpoints': _wg.endpoints}            if _wg.endpoints is defined            else {})
      | combine({'persistent_keepalive': _wg.persistent_keepalive} if _wg.persistent_keepalive is defined else {})
      | combine({'preshared_key_ref': _wg.preshared_key_ref} if _wg.preshared_key_ref is defined else {})
    }}"
    wg_iface: "{{
      {'name': peer.interface,
       'address_mode': _wg.address_mode | default(_d.address_mode),
       'listen_port': _wg.listen_port,
       'table': _wg.table | default(_d.table),
       'peer': _peer,
       'post_up': _wg.post_up | default(_d.post_up)}
      | combine({'fwmark': _wg.fwmark}                 if _wg.fwmark is defined              else {})
      | combine({'mtu': _wg.mtu}                       if _wg.mtu is defined                 else {})
      | combine({'private_key_ref': _wg.private_key_ref} if _wg.private_key_ref is defined    else {})
      | combine({'pre_up': _wg.pre_up}                 if _wg.pre_up is defined              else {})
      | combine({'pre_down': _wg.pre_down}             if _wg.pre_down is defined            else {})
      | combine({'post_down': _wg.post_down}           if _wg.post_down is defined           else {})
      | combine({'address': _wg.address}               if _wg.address is defined             else {})
      | combine({'preshared_key_ref': _wg.preshared_key_ref} if _wg.preshared_key_ref is defined else {})
    }}"

# ── Intra peer intent → intra iBGP sessions ────────────────────────────

- name: Initialize generated intra iBGP sessions
  ansible.builtin.set_fact:
    generated_intra_ibgp_sessions: []

- name: Build generated intra iBGP sessions from intra peers
  ansible.builtin.set_fact:
    generated_intra_ibgp_sessions: "{{ generated_intra_ibgp_sessions + [bgp_session] }}"
  loop: "{{ effective_intra_auto_confed_peers }}"
  loop_control:
    loop_var: peer
  vars:
    _bgp: "{{ peer.bgp | default({}) }}"
    _ipv4: "{{ _bgp.ipv4 | default({}) }}"
    _ipv6: "{{ _bgp.ipv6 | default({}) }}"
    _base: "{{
      {'file': _bgp.file,
       'protocol': _bgp.protocol,
       'neighbor': {'node': peer.node, 'interface': peer.interface}}
    }}"
    _ipv4_block: "{{ {'ipv4': {'import_policy': _ipv4.import_policy, 'export_policy': _ipv4.export_policy}} if _ipv4.import_policy is defined else {} }}"
    _ipv6_block: "{{ {'ipv6': {'import_policy': _ipv6.import_policy, 'export_policy': _ipv6.export_policy}} if _ipv6.import_policy is defined else {} }}"
    _local_as: "{{ {'local_as': _bgp.local_as} if _bgp.local_as is defined else {} }}"
    bgp_session: "{{ _base | combine(_ipv4_block) | combine(_ipv6_block) | combine(_local_as) }}"

# ── DN42 peer intent → WireGuard interfaces ────────────────────────────

- name: Initialize generated DN42 WireGuard interfaces
  ansible.builtin.set_fact:
    generated_wireguard_dn42: []

- name: Build generated WireGuard interfaces from DN42 peers
  ansible.builtin.set_fact:
    generated_wireguard_dn42: "{{ generated_wireguard_dn42 + [wg_iface] }}"
  loop: "{{ (dn42.peers | default([])) | selectattr('wireguard', 'defined') | list }}"
  loop_control:
    loop_var: peer
  vars:
    _wg: "{{ peer.wireguard | default({}) }}"
    _d: "{{ dn42_wireguard_defaults | default({}) }}"
    _iface_name: "{{ _wg.interface | default('dn42_' ~ peer.asn) }}"
    _ula_transport: "{{ peer.ula is defined and peer.src is defined }}"
    _ula_post_up: "ip -6 addr add {{ peer.src }}/128 peer {{ peer.ula }}/128 dev %i || true"
    _ula_post_down: "ip -6 addr del {{ peer.src }}/128 dev %i || true"
    _post_up: "{{ (_wg.post_up | default(_d.post_up)) + ([_ula_post_up] if _ula_transport else []) }}"
    _post_down: "{{ ([_ula_post_down] if _ula_transport else []) + (_wg.post_down | default([])) }}"
    _peer: "{{
      {'public_key': _wg.public_key,
       'allowed_ips': _wg.allowed_ips | default(_d.allowed_ips)}
      | combine({'endpoint': _wg.endpoint}              if _wg.endpoint is defined              else {})
      | combine({'endpoints': _wg.endpoints}            if _wg.endpoints is defined            else {})
      | combine({'persistent_keepalive': _wg.persistent_keepalive} if _wg.persistent_keepalive is defined else {})
      | combine({'preshared_key_ref': _wg.preshared_key_ref} if _wg.preshared_key_ref is defined else {})
    }}"
    wg_iface: "{{
      {'name': _iface_name,
       'address': _wg.address | default(_d.address),
       'listen_port': _wg.listen_port,
       'table': _wg.table | default(_d.table),
       'peer': _peer,
       'post_up': _post_up,
       'post_down': _post_down}
      | combine({'fwmark': _wg.fwmark}                 if _wg.fwmark is defined              else {})
      | combine({'mtu': _wg.mtu}                       if _wg.mtu is defined                 else {})
      | combine({'private_key_ref': _wg.private_key_ref} if _wg.private_key_ref is defined    else {})
      | combine({'pre_up': _wg.pre_up}                 if _wg.pre_up is defined              else {})
      | combine({'pre_down': _wg.pre_down}             if _wg.pre_down is defined            else {})
      | combine({'address_mode': _wg.address_mode}     if _wg.address_mode is defined        else {})
    }}"

# ── Merge generated + legacy ───────────────────────────────────────────

- name: Build effective WireGuard interface list
  ansible.builtin.set_fact:
    effective_wireguard_interfaces: >-
      {{
        (generated_wireguard_intra if generated_wireguard_intra is defined else [])
        + (generated_wireguard_dn42 if generated_wireguard_dn42 is defined else [])
        + (generated_wireguard_interfaces if generated_wireguard_interfaces is defined else [])
        + (wireguard.interfaces if wireguard is defined and wireguard.interfaces is defined and wireguard.interfaces is not none else [])
      }}

- name: Build effective intra iBGP session list
  ansible.builtin.set_fact:
    effective_intra_ibgp_sessions: >-
      {{
        (generated_intra_ibgp_sessions if generated_intra_ibgp_sessions is defined else [])
        + (effective_intra_explicit_confed_peers if effective_intra_explicit_confed_peers is defined else [])
      }}

- name: Ensure effective lists are set
  ansible.builtin.set_fact:
    effective_wireguard_interfaces: "{{ effective_wireguard_interfaces | default([]) }}"
    effective_intra_ibgp_sessions: "{{ effective_intra_ibgp_sessions | default([]) }}"
