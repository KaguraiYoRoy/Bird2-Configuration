template bgp iana_ix{
    router id IANA_ROUTER_ID;
    local as IANA_OWNAS;
    ipv6 {
        import filter {
            if net ~ [::/0] then reject;
            bgp_large_community.add((205369,1000,1));
            bgp_large_community.add((205369,2000,2));
            accept;
        };
        export filter {
            if is_self_iana_v6() then {
                if !iana_should_export() then reject;
                remove_confederation_as();
                remove_private_community();
                accept;
            }
            reject;
        };
    };
    graceful restart;
}

protocol bgp 'iana_ix_zxix_rs1' from iana_ix{
    local 2406:840:1f:1000::20:5369:1;
    neighbor 2406:840:1f:1000::1 as 140961;
}

protocol bgp 'iana_ix_zxix_rs2' from iana_ix{
    local 2406:840:1f:1000::20:5369:1;
    neighbor 2406:840:1f:1000::2 as 140961;
}

protocol bgp 'iana_ix_akix' from iana_ix{
    local 2602:f92a:1315:2::34;
    neighbor 2602:f92a:1315:2::1 as 203168;
}
