template bgp iana_ibgp {
    local as IANA_OWNAS;
    neighbor as IANA_OWNAS;
    path metric 1;
    multihop;
    router id IANA_ROUTER_ID;

    ipv6 {
        import filter {
            if net.len > 48 then reject;
            if source = RTS_BGP || is_self_iana_v6() then {
                bgp_large_community.add((205369,1000,1));
                accept;
            }
            reject;
        };
        export filter {
            if source = RTS_BGP || is_self_iana_v6() then {
                if !iana_should_export_downstream() then reject;
                remove_confederation_as();
                remove_private_community();
                accept;
            }
            reject;
        };
        next hop self;
    };

    graceful restart; 
}

protocol bgp 'iana_ibgp_LeZi' from iana_ibgp{
    neighbor fe80::2053:69b % 'dn42_4242423377';
    local fe80::2053:69a;
    direct;
}
