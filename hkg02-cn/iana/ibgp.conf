function iana_ibgp_add_community(){
    
}

function iana_ibgp_check_community(){
    if !(bgp_large_community ~ [(205369,1,1)]) then return false; # control: allow to be advertised on IANA infrastructures
    if bgp_large_community ~ [(205369,65535,65282)] then return false; # control: no-advertise
    return true;
}


template bgp iana_ibgp {
    local as IANA_OWNAS;
    neighbor as IANA_OWNAS;
    path metric 1;
    multihop;
    router id IANA_ROUTER_ID;

    ipv6 {
        import filter {
            if !iana_filter_default_check() then reject;
            iana_ibgp_add_community();
            accept;
        };
        export filter {
            if !iana_filter_default_check() then reject;
            if !iana_ibgp_check_community() then reject;
            remove_confederation_as();
            remove_private_community();
            accept;
        };
        next hop self;
    };

    graceful restart; 
}

protocol bgp 'iana_ibgp_LeZi' from iana_ibgp{
    neighbor fe80::2053:69b % 'dn42_4242423377';
    local fe80::2053:69a;
    direct;
}
