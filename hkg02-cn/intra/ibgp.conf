function intra_ibgp_check_community(){
    if !(bgp_large_community ~ [(205369,1,1)] || bgp_large_community ~ [(4242422024,1,1)]) then return false; # control: allow to be advertised on both DN42 and IANA infrastructures
    if bgp_large_community ~ [(205369,65535,65282)] || bgp_large_community ~ [(4242422024,65535,65282)] then return false; # control: no-advertise

    if bgp_large_community ~ [(205369,2,*)] then return false;

    return true;
}

template bgp intra_ibgpeers {
    router   id DN42_OWNIP;
    local    as INTRA_OWNAS;
    neighbor external;

    ipv4 {
        table master4;
        import filter{
            if !intra_ibgp_check_community() then reject;
            accept;
        };
        export filter {
            if !intra_ibgp_check_community() then reject;
            accept;
        };
        extended next hop;
    };
    ipv6 {
        table master6;
        import filter{
            if !intra_ibgp_check_community() then reject;
            accept;
        };
        export filter {
            if !intra_ibgp_check_community() then reject;
            accept;
        };
    };
};

include "ibgp/*";
