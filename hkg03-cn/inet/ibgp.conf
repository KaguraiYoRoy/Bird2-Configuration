template bgp inet_ibgp {
    local as INET_OWNAS;
    neighbor as INET_OWNAS;
    path metric 1;
    multihop;
    router id INET_ROUTER_ID;

    ipv6 {
        import filter {
            if net.len > 48 then reject;
            if source = RTS_BGP || is_self_inet_v6() then accept;
            reject;
        };
        export filter {
            if source = RTS_BGP || is_self_inet_v6() then accept;
            reject;
        };
        next hop self;
    };

    graceful restart; 
}

protocol bgp 'inet_ibgp_LeZi' from inet_ibgp{
    neighbor fe80::2053:69b % 'dn42_4242423377';
    local fe80::2053:69a;
    direct;
}
