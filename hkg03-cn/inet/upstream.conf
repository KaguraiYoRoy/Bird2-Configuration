template bgp inet_upstream {
    local as INET_OWNAS;
    path metric 1;
    multihop;
    router id INET_ROUTER_ID;

    ipv6 {
        import filter {
            if net ~ [::/0] then reject;
            krt_prefsrc = INET_OWNIPv6;
            accept;
        };
        export filter {
            if is_valid_dn42_network_v6() then reject;
            if is_self_inet_v6() then accept;
            reject;
        };
        export limit 10;
    };

    graceful restart; 
}

protocol bgp 'inet_upstream_7720' from inet_upstream{
    description "Skywolf";
    local 2401:5a0:1000:3b::a;
    neighbor fd00:7720::1 as 7720;
}

