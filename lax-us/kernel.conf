protocol kernel kernel_v4{  
    ipv4 {
        table master4;
        import none;
        export filter {
            if source = RTS_STATIC then reject;
            if is_valid_dn42_network() || is_self_dn42_net() then krt_prefsrc = DN42_OWNIP;
            accept;
        };
    };
}

protocol kernel kernel_v6 {
    ipv6 {
        table master6;
        import none;
        export filter {
            if source = RTS_STATIC then reject;
            if is_valid_dn42_network_v6() || is_self_dn42_net_v6() then krt_prefsrc = DN42_OWNIPv6;
            # else krt_prefsrc = INET_OWNIPv6;
            accept;
        };
    };
}
